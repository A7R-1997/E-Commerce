version: '3.8'

services:
  web:
    build: .
    ports:
      - "8085:8000"
    depends_on:
      db:
        condition: service_healthy  
    environment:
      - DATABASE_URL=postgresql://postgres:1997@db/ecommerce_db
    volumes:
      - ./reports:/app/reports

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1997
      - POSTGRES_DB=ecommerce_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_db"]
      interval: 3s
      timeout: 3s
      retries: 5