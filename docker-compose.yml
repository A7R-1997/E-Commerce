services:
  web:
    build: .
    ports:
      - "8085:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:1997@db/ecommerce_db
    volumes:
      - ./reports:/app/reports

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1997
      - POSTGRES_DB=ecommerce_db
    ports:
      - "5432:5432"